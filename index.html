<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jimma Market</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">
  <div class="logo">
    🛒 <h1>Jimma Market</h1>
  </div>

  <nav>
    <a href="#">Home</a>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
    <a href="#login">Login</a>
  </nav>
</header>

<section class="hero">
  <h2>Welcome to Jimma Market</h2>
  <p>Buy and Sell Everything Easily</p>

  <a href="#products" class="btn">
    Shop Now
  </a>
</section>

<section class="search-box">
  <input
    type="text"
    id="search"
    placeholder="Search products..."
    onkeyup="searchProducts()">
</section>

<section id="products" class="products">

</section>

<section class="cart">
  <h2>🛒 Shopping Cart</h2>

  <div id="cart-items"></div>

  <h3>Total:
    <span id="total">0</span>
    ETB
  </h3>
</section>
<section id="login" class="login-box">

<h2>Login</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<button onclick="register()">Register</button>

<button onclick="logout()">Logout</button>

</section>

<section class="upload">

<h2>Add Product</h2>

<form id="productForm">

<input type="text" id="name" placeholder="Product Name" required>

<input type="number" id="price" placeholder="Price (ETB)" required>

<input type="file" id="photo" accept="image/*" required>

<button type="submit">Upload Product</button>

</form>

</section>

<section id="contact">

<h2>Contact Seller</h2>

<a href="tel:+251924381526">
<button>📞 Call Seller</button>
</a>

<a href="https://wa.me/251924381526?text=ሰላም፣ ይህን ምርት መግዛት እፈልጋለሁ">
<button>💬 WhatsApp</button>
</a>

</section>

<footer>

<p>© 2026 Jimma Market. All Rights Reserved.</p>

</footer>

<script src="auth.js"></script>

<script src="script.js"></script>

</body>
</html>
